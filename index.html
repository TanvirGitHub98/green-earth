<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Earth</title>
    <link rel="shortcut icon" href="./assets/about.png" type="image/x-icon" />
    <!-- Font awesome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!--  Google font link-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind + daisyUI link-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--External CSS link -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <!-- navigation bar start -->
    <header>
      <div class="navbar bg-[#15803D] text-white shadow-sm">
        <div class="navbar-start">
          <h2 class="text-2xl">Green Earth</h2>
        </div>
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1 font-medium">
            <li><a>About</a></li>
            <li><a>Gallery</a></li>
            <li><a>Plant a Tree</a></li>
          </ul>
        </div>
        <div class="navbar-end">
          <a class="btn bg-[#FACC15] rounded-2xl border-none">Plant a Tree</a>
        </div>
      </div>
    </header>
    <!-- Navigation bar end -->
    <!-- banner section start -->
    <section>
      <div class="banner-container flex items-center bg-[#CFF0DC]">
        <div>
          <img src="./assets/hero-leaf1.png" alt="" class="w-80"/>
        </div>
        <div class="space-y-5 text-center flex-1">
          <h2 class="font-bold text-5xl">Plant a Tree, Grow a Future</h2>
          <p class="text-[#1F2937] text-xs">
            Join our mission to plant 1 million trees and make the Earth greener
            for future generations.
          </p>
          <button class="btn bg-[#FACC15] text-[#15803D] rounded-4xl">Get Involved</button>
        </div>
        <div>
          <img src="./assets/hero-leaf2.png" alt="" class="w-80" />
        </div>
      </div>
    </section>
    <!-- banner section end -->

    <script src="./script/index.js"></script>
  </body>
</html>
